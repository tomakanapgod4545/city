name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p Sources
          cat > project.yml << 'EOF_PROJ'
          name: TikReader
          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "15.0"
          targets:
            TikReader:
              type: application
              platform: iOS
              sources:
                - Sources
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: コメント読み上げ
                  UIBackgroundModes:
                    - audio
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.tikreader
                  SWIFT_VERSION: "5.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
          EOF_PROJ
          cat > Sources/App.swift << 'EOF_SWIFT'
          import SwiftUI
          import AVFoundation
          import UIKit

          @main
          struct TikReaderApp: App {
              @StateObject private var reader = Reader()
              var body: some Scene {
                  WindowGroup {
                      ContentView().environmentObject(reader)
                  }
              }
          }

          // MARK: - 読み上げ本体(サーバーからコメントを受け取って読む)
          final class Reader: NSObject, ObservableObject, AVSpeechSynthesizerDelegate, URLSessionDataDelegate {
              @Published var status = "停止中"
              @Published var running = false
              @Published var log: [String] = []

              private let ud = UserDefaults.standard
              private let synth = AVSpeechSynthesizer()
              private var queue: [String] = []
              private var speaking = false

              private var session: URLSession?
              private var buf = Data()
              private var base = ""
              private var user = ""
              private var retryWork: DispatchWorkItem?

              // 無音を流し続けて、バックグラウンドでも止まりにくくする
              private let engine = AVAudioEngine()
              private let silence = AVAudioPlayerNode()
              private var silenceBuffer: AVAudioPCMBuffer?
              private var engineReady = false

              override init() {
                  super.init()
                  synth.delegate = self
                  ud.register(defaults: [
                      "rate": 0.52, "pitch": 1.0, "maxQ": 5, "maxLen": 60,
                      "skipUrl": true, "keepAwake": false,
                      "giftT": "{name}さん、{gift}を{count}個ありがとう!",
                      "chatT": "{name}さん、{comment}",
                      "ng": "", "user": "", "server": ""
                  ])
                  NotificationCenter.default.addObserver(self, selector: #selector(interrupted(_:)),
                                                         name: AVAudioSession.interruptionNotification, object: nil)
              }

              // MARK: 開始 / 停止
              func start() {
                  let u = (ud.string(forKey: "user") ?? "")
                      .replacingOccurrences(of: "@", with: "")
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  var b = (ud.string(forKey: "server") ?? "").trimmingCharacters(in: .whitespacesAndNewlines)
                  if u.isEmpty { status = "ユーザー名を入力してください"; return }
                  if b.isEmpty { status = "サーバーのURLを入力してください"; return }
                  if !b.hasPrefix("http") { b = "https://" + b }
                  while b.hasSuffix("/") { b.removeLast() }
                  user = u; base = b
                  running = true
                  status = "接続中…"
                  startAudio()
                  UIApplication.shared.isIdleTimerDisabled = ud.bool(forKey: "keepAwake")
                  speak("読み上げを開始します", priority: true)
                  connect()
              }

              func stop(message: String? = nil) {
                  running = false
                  retryWork?.cancel()
                  session?.invalidateAndCancel()
                  session = nil
                  queue.removeAll()
                  speaking = false
                  synth.stopSpeaking(at: .immediate)
                  silence.stop()
                  engine.stop()
                  try? AVAudioSession.sharedInstance().setActive(false, options: .notifyOthersOnDeactivation)
                  UIApplication.shared.isIdleTimerDisabled = false
                  status = message ?? "停止中"
              }

              // MARK: 音声セッション
              private func startAudio() {
                  let s = AVAudioSession.sharedInstance()
                  try? s.setCategory(.playback, mode: .spokenAudio, options: [.mixWithOthers])
                  try? s.setActive(true)
                  if !engineReady {
                      let fmt = AVAudioFormat(standardFormatWithSampleRate: 44100, channels: 1)!
                      let buffer = AVAudioPCMBuffer(pcmFormat: fmt, frameCapacity: 44100)!
                      buffer.frameLength = 44100
                      if let p = buffer.floatChannelData?[0] {
                          for i in 0..<Int(buffer.frameLength) { p[i] = 0 }
                      }
                      silenceBuffer = buffer
                      engine.attach(silence)
                      engine.connect(silence, to: engine.mainMixerNode, format: fmt)
                      engineReady = true
                  }
                  if !engine.isRunning { try? engine.start() }
                  if let b = silenceBuffer {
                      silence.stop()
                      silence.scheduleBuffer(b, at: nil, options: .loops, completionHandler: nil)
                      silence.play()
                  }
              }

              @objc private func interrupted(_ n: Notification) {
                  DispatchQueue.main.async {
                      guard self.running,
                            let raw = n.userInfo?[AVAudioSessionInterruptionTypeKey] as? UInt,
                            AVAudioSession.InterruptionType(rawValue: raw) == .ended else { return }
                      self.startAudio()
                  }
              }

              // MARK: サーバー接続(SSE)
              private func connect() {
                  guard running else { return }
                  guard var comps = URLComponents(string: base + "/events") else {
                      stop(message: "サーバーのURLが正しくありません"); return
                  }
                  comps.queryItems = [URLQueryItem(name: "user", value: user)]
                  guard let url = comps.url else { stop(message: "サーバーのURLが正しくありません"); return }

                  var req = URLRequest(url: url)
                  req.setValue("text/event-stream", forHTTPHeaderField: "Accept")
                  req.timeoutInterval = 86400
                  let cfg = URLSessionConfiguration.default
                  cfg.timeoutIntervalForRequest = 86400
                  cfg.timeoutIntervalForResource = 86400
                  cfg.requestCachePolicy = .reloadIgnoringLocalCacheData

                  buf = Data()
                  let s = URLSession(configuration: cfg, delegate: self, delegateQueue: nil)
                  session = s
                  s.dataTask(with: req).resume()
              }

              func urlSession(_ session: URLSession, dataTask: URLSessionDataTask,
                              didReceive response: URLResponse,
                              completionHandler: @escaping (URLSession.ResponseDisposition) -> Void) {
                  if let h = response as? HTTPURLResponse, h.statusCode != 200 {
                      DispatchQueue.main.async { self.stop(message: "サーバーに接続できません(\(h.statusCode))") }
                      completionHandler(.cancel)
                      return
                  }
                  completionHandler(.allow)
              }

              func urlSession(_ session: URLSession, dataTask: URLSessionDataTask, didReceive data: Data) {
                  DispatchQueue.main.async {
                      guard session === self.session else { return }
                      self.buf.append(data)
                      self.drain()
                  }
              }

              func urlSession(_ session: URLSession, task: URLSessionTask, didCompleteWithError error: Error?) {
                  DispatchQueue.main.async {
                      guard self.running, session === self.session else { return }
                      self.status = "再接続中…"
                      let w = DispatchWorkItem { [weak self] in
                          guard let self = self, self.running else { return }
                          self.connect()
                      }
                      self.retryWork = w
                      DispatchQueue.main.asyncAfter(deadline: .now() + 3, execute: w)
                  }
              }

              private func drain() {
                  let sep = Data("\n\n".utf8)
                  while let r = buf.range(of: sep) {
                      let block = buf.subdata(in: buf.startIndex..<r.lowerBound)
                      buf.removeSubrange(buf.startIndex..<r.upperBound)
                      handle(String(decoding: block, as: UTF8.self))
                  }
              }

              private func handle(_ block: String) {
                  var event = "message"
                  var dataStr = ""
                  for line in block.split(separator: "\n", omittingEmptySubsequences: true) {
                      if line.hasPrefix("event:") {
                          event = line.dropFirst(6).trimmingCharacters(in: .whitespaces)
                      } else if line.hasPrefix("data:") {
                          dataStr += line.dropFirst(5).trimmingCharacters(in: .whitespaces)
                      }
                  }
                  guard !dataStr.isEmpty,
                        let obj = (try? JSONSerialization.jsonObject(with: Data(dataStr.utf8))) as? [String: Any]
                  else { return }

                  switch event {
                  case "status":
                      let state = obj["state"] as? String ?? ""
                      let msg = obj["message"] as? String ?? ""
                      if state == "connected" {
                          status = "接続OK。コメントを待っています"
                      } else if state == "error" {
                          stop(message: "接続できません: \(msg)(配信中か確認してください)")
                      } else if state == "ended" {
                          stop(message: "配信が終了しました")
                      } else if state == "disconnected" {
                          status = "TikTokとの接続が切れました。再接続します"
                          session?.invalidateAndCancel() // 完了処理から自動で再接続
                      }
                  case "chat":
                      let name = obj["name"] as? String ?? ""
                      let comment = clean(obj["comment"] as? String ?? "")
                      if comment.isEmpty || isNG(comment) { return }
                      addLog("\(name): \(comment)")
                      speak(fill(ud.string(forKey: "chatT") ?? "{comment}", name: name, comment: comment))
                  case "gift":
                      let name = obj["name"] as? String ?? ""
                      let gift = obj["gift"] as? String ?? "ギフト"
                      let count = obj["count"] as? Int ?? 1
                      addLog("🎁 \(name) → \(gift) ×\(count)")
                      speak(fill(ud.string(forKey: "giftT") ?? "", name: name, gift: gift, count: count), priority: true)
                  default:
                      break
                  }
              }

              // MARK: テキスト処理
              private func fill(_ t: String, name: String = "", comment: String = "", gift: String = "", count: Int = 0) -> String {
                  t.replacingOccurrences(of: "{name}", with: name)
                   .replacingOccurrences(of: "{comment}", with: comment)
                   .replacingOccurrences(of: "{gift}", with: gift)
                   .replacingOccurrences(of: "{count}", with: count > 0 ? String(count) : "")
              }

              private func clean(_ text: String) -> String {
                  var t = text
                  if ud.bool(forKey: "skipUrl") {
                      t = t.replacingOccurrences(of: "https?://\\S+", with: "", options: .regularExpression)
                  }
                  t = t.trimmingCharacters(in: .whitespacesAndNewlines)
                  let maxLen = max(1, ud.integer(forKey: "maxLen"))
                  if t.count > maxLen { t = String(t.prefix(maxLen)) + "、以下省略" }
                  return t
              }

              private func isNG(_ text: String) -> Bool {
                  let words = (ud.string(forKey: "ng") ?? "")
                      .components(separatedBy: CharacterSet(charactersIn: ",、\n"))
                      .map { $0.trimmingCharacters(in: .whitespaces) }
                      .filter { !$0.isEmpty }
                  return words.contains { text.contains($0) }
              }

              private func addLog(_ s: String) {
                  log.insert(s, at: 0)
                  if log.count > 50 { log.removeLast() }
              }

              // MARK: 読み上げ(順番待ち)
              func speak(_ text: String, priority: Bool = false) {
                  if text.isEmpty { return }
                  if priority { queue.insert(text, at: 0) } else { queue.append(text) }
                  let mx = max(1, ud.integer(forKey: "maxQ"))
                  while queue.count > mx { queue.removeFirst() } // 溜まりすぎたら古いものを飛ばす
                  next()
              }

              func testGift() {
                  let t = fill(ud.string(forKey: "giftT") ?? "", name: "テスト", gift: "バラ", count: 3)
                  // 停止中でも声が出るように音声セッションを用意
                  if !running {
                      let s = AVAudioSession.sharedInstance()
                      try? s.setCategory(.playback, mode: .spokenAudio, options: [.mixWithOthers])
                      try? s.setActive(true)
                  }
                  speak(t, priority: true)
              }

              private func next() {
                  guard !speaking, !queue.isEmpty else { return }
                  let text = queue.removeFirst()
                  let u = AVSpeechUtterance(string: text)
                  u.voice = AVSpeechSynthesisVoice(language: "ja-JP")
                  u.rate = Float(ud.double(forKey: "rate"))
                  u.pitchMultiplier = Float(ud.double(forKey: "pitch"))
                  u.volume = 1.0
                  speaking = true
                  synth.speak(u)
              }

              func speechSynthesizer(_ s: AVSpeechSynthesizer, didFinish utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async { self.speaking = false; self.next() }
              }
              func speechSynthesizer(_ s: AVSpeechSynthesizer, didCancel utterance: AVSpeechUtterance) {
                  DispatchQueue.main.async { self.speaking = false; self.next() }
              }
          }

          // MARK: - 画面
          struct ContentView: View {
              @EnvironmentObject var reader: Reader

              @AppStorage("user") private var user = ""
              @AppStorage("server") private var server = ""
              @AppStorage("rate") private var rate = 0.52
              @AppStorage("pitch") private var pitch = 1.0
              @AppStorage("giftT") private var giftT = "{name}さん、{gift}を{count}個ありがとう!"
              @AppStorage("chatT") private var chatT = "{name}さん、{comment}"
              @AppStorage("ng") private var ng = ""
              @AppStorage("maxLen") private var maxLen = 60
              @AppStorage("maxQ") private var maxQ = 5
              @AppStorage("skipUrl") private var skipUrl = true
              @AppStorage("keepAwake") private var keepAwake = false

              var body: some View {
                  NavigationView {
                      Form {
                          Section(header: Text("接続")) {
                              TextField("TikTokのユーザー名(@なし)", text: $user)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                              TextField("サーバーのURL", text: $server)
                                  .textInputAutocapitalization(.never)
                                  .disableAutocorrection(true)
                                  .keyboardType(.URL)
                          }

                          Section(header: Text("読み上げ")) {
                              VStack(alignment: .leading) {
                                  Text("速度 ×" + String(format: "%.1f", rate / 0.5))
                                  Slider(value: $rate, in: 0.35...0.75)
                              }
                              VStack(alignment: .leading) {
                                  Text("声の高さ " + String(format: "%.1f", pitch))
                                  Slider(value: $pitch, in: 0.5...2.0)
                              }
                          }

                          Section(header: Text("読み上げる文"),
                                  footer: Text("{name}=送った人 {gift}=ギフト名 {count}=個数 {comment}=コメント")) {
                              TextField("ギフトが来た時", text: $giftT)
                              TextField("コメントの形式", text: $chatT)
                          }

                          Section {
                              Button(reader.running ? "停止" : "読み上げ開始") {
                                  if reader.running { reader.stop() } else { reader.start() }
                              }
                              .font(.headline)
                              .foregroundColor(reader.running ? .red : .accentColor)
                              Button("声のテスト") { reader.testGift() }
                              Text(reader.status).foregroundColor(.secondary)
                          }

                          Section(header: Text("詳細設定")) {
                              TextField("NGワード(カンマ区切り)", text: $ng)
                              Stepper("最大文字数 \(maxLen)", value: $maxLen, in: 10...200, step: 10)
                              Stepper("読み上げ待ちの上限 \(maxQ)", value: $maxQ, in: 1...20)
                              Toggle("URLは読まない", isOn: $skipUrl)
                              Toggle("画面を消さない", isOn: $keepAwake)
                          }

                          Section(header: Text("コメント履歴")) {
                              ForEach(reader.log, id: \.self) { Text($0).font(.footnote) }
                          }
                      }
                      .navigationTitle("コメント読み上げ")
                  }
                  .navigationViewStyle(.stack)
              }
          }
          EOF_SWIFT
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project TikReader.xcodeproj -scheme TikReader \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TikReader.app Payload/
          zip -r TikReader.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TikReader-ipa
          path: TikReader.ipa
